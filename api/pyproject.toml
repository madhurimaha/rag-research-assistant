[project]
name = "rag-research-assistant"
version = "0.1.0"
description = "Hybrid-retrieval RAG over a research-paper corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pymupdf>=1.24",
    "fastembed>=0.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "redis>=5.2",
]

[project.optional-dependencies]
# Provider SDKs are optional: ingestion, retrieval and reranking need neither, so the app
# installs and runs without an LLM account. Install the one you have a key for.
openai = ["openai>=1.54"]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
